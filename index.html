    <script type="text/javascript">
      // 정적 호스팅(404.html)에서 리다이렉트된 경우 원래 하위 경로 및 쿼리 파라미터를 즉시 복원합니다.
      (function () {
        try {
          var raw = sessionStorage.getItem('__ds_mro_spa_redirect__');
          if (!raw) return;
          sessionStorage.removeItem('__ds_mro_spa_redirect__');
          var data = JSON.parse(raw);
          if (!data || Date.now() - (data.timestamp || 0) > 15000) return;

          var pathname = data.pathname || '/';
          var search = data.search || '';
          var hash = data.hash || '';

          // 하위 경로(예: /ds-mro/account-management 또는 /master-data)에서 탭 슬러그 추출
          var cleanPath = pathname.replace(/^\/ds-mro\/?/, '/').replace(/^\/+|\/+$/g, '');
          var validTabs = [
            'dashboard',
            'field-audit',
            'order-sheet',
            'master-data',
            'stats',
            'account-management'
          ];
          var segments = cleanPath ? cleanPath.split('/') : [];
          var params = new URLSearchParams(search);

          if (segments.length > 0 && validTabs.indexOf(segments[0]) !== -1 && !params.get('tab')) {
            params.set('tab', segments[0]);
          }

          var basePath = pathname.indexOf('/ds-mro') === 0 ? '/ds-mro/' : '/';
          var queryString = params.toString();
          var restoredUrl = basePath + (queryString ? '?' + queryString : '') + hash;
          window.history.replaceState(null, '', restoredUrl);
        } catch (e) {}
      })();
    </script>
