name: Deploy ds-mro Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # 참고: 만약 GitHub Pages로 정적 배포를 원하실 경우 아래 액션을 활용할 수 있습니다.
      # (Vercel이나 Netlify 등을 연동 중이시라면 빌드 단계까지만 수행하고 해당 플랫폼에서 자동 연동되도록 하시면 됩니다.)
